<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your personal task organizer." />
    <title>Sign in | Simple To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">Personal organizer</p>
        <h1 id="auth-title">Welcome back</h1>
        <p id="auth-intro" class="auth-intro">Sign in to manage your tasks.</p>

        <form id="auth-form" class="auth-form">
          <div id="name-field" class="auth-field" hidden>
            <label for="auth-name">Name</label>
            <input id="auth-name" name="name" type="text" autocomplete="name" maxlength="80" />
          </div>
          <div id="email-field" class="auth-field">
            <label for="auth-email">Email address</label>
            <input id="auth-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div id="otp-field" class="auth-field" hidden>
            <label for="auth-otp">Verification code</label>
            <input id="auth-otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" />
          </div>
          <div id="password-field" class="auth-field">
            <label for="auth-password">Password</label>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="6" required />
          </div>
          <div id="confirm-password-field" class="auth-field" hidden>
            <label for="auth-confirm-password">Confirm password</label>
            <input id="auth-confirm-password" name="confirm-password" type="password" autocomplete="new-password" minlength="6" />
          </div>
          <button id="auth-submit" class="auth-submit" type="submit">Sign in</button>
          <p id="auth-message" class="auth-message" role="alert" aria-live="polite"></p>
        </form>

        <section id="auth-success-panel" class="auth-success-panel" aria-live="polite" hidden>
          <p>Your password has been reset successfully.</p>
          <button id="go-to-login-button" class="auth-submit" type="button">Go to Sign in</button>
        </section>

        <button id="forgot-password-button" class="forgot-password-button" type="button">Forgot password?</button>
        <p id="auth-switch" class="auth-switch">
          <span id="auth-switch-text">New here?</span>
          <button id="auth-switch-button" type="button">Create an account</button>
        </p>
      </section>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
