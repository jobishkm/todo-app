<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple to-do application that saves tasks in your browser."
    />
    <title>Simple To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=mobile-more-sheet" />
  </head>
  <body>
    <main class="app-shell">
      <div class="app-layout">
        <aside class="sidebar" aria-label="Task navigation">
          <nav class="filters" aria-label="Filter tasks">
            <button class="filter-button is-selected" type="button" data-filter="today" aria-pressed="true">
              <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4M8 14h3M8 18h6" /></svg>
              <span>Today</span><span id="today-filter-count" class="filter-count">0</span>
            </button>
            <button class="filter-button" type="button" data-filter="overdue" aria-pressed="false">
              <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" /><path d="M12 7v5l3 2" /></svg>
              <span>Overdue</span><span id="overdue-filter-count" class="filter-count">0</span>
            </button>
            <button class="filter-button" type="button" data-filter="calendar" aria-pressed="false">
              <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01" /></svg>
              <span>Calendar</span>
            </button>
            <button class="filter-button" type="button" data-filter="archived" aria-pressed="false">
              <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4z" /><path d="M3 4h18v3H3zM9 12h6" /></svg>
              <span>Archive</span>
            </button>
            <div class="mobile-more">
              <button id="mobile-more-button" class="filter-button mobile-more-trigger" type="button" aria-expanded="false" aria-haspopup="dialog">
                <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5" /><circle cx="12" cy="12" r="1.5" /><circle cx="19" cy="12" r="1.5" /></svg>
                <span>More</span>
              </button>
              <div id="mobile-more-backdrop" class="mobile-more-backdrop" hidden></div>
              <div id="mobile-more-menu" class="mobile-more-menu" role="dialog" aria-modal="true" aria-label="More options" hidden>
                <div class="mobile-more-profile">
                  <span id="mobile-profile-avatar" class="profile-avatar" aria-hidden="true"></span>
                  <span id="mobile-profile-email" class="profile-email"></span>
                </div>
                <button id="mobile-archive-button" type="button">Archive</button>
                <button id="mobile-settings-button" type="button">Settings</button>
                <button id="mobile-sign-out-button" type="button">Sign out</button>
              </div>
            </div>
          </nav>
          <div class="sidebar-profile">
            <button
              id="profile-menu-button"
              class="profile-trigger"
              type="button"
              aria-expanded="false"
              aria-controls="profile-menu"
            >
              <span id="profile-avatar" class="profile-avatar" aria-hidden="true"></span>
              <span id="profile-email" class="profile-email"></span>
              <svg class="profile-chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m7 10 5 5 5-5" />
              </svg>
            </button>
            <div id="profile-menu" class="profile-menu" role="menu" hidden>
              <button id="profile-settings-button" type="button" role="menuitem">Settings</button>
              <button id="profile-sign-out-button" type="button" role="menuitem">Sign out</button>
            </div>
          </div>
        </aside>

        <section class="task-panel task-list-panel" aria-labelledby="tasks-heading">
          <div class="list-heading">
            <div>
              <div class="page-title-row">
                <h2 id="tasks-heading">Your list</h2>
                <button id="upcoming-calendar-button" class="upcoming-calendar-button" type="button" aria-label="Choose a date" aria-haspopup="dialog" aria-controls="upcoming-calendar-dialog">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2" />
                    <path d="M3 10h18M8 3v4M16 3v4" />
                  </svg>
                </button>
              </div>
              <p id="task-count" aria-live="polite">0 tasks remaining</p>
            </div>
          </div>

        <section id="new-task-panel" class="task-panel new-task-panel" aria-labelledby="add-task-heading" hidden>
          <h2 id="add-task-heading" class="visually-hidden">Add a task</h2>
          <form id="task-form" class="task-form">
            <label class="visually-hidden" for="task-input">Task title</label>
            <textarea
              id="task-input"
              name="task"
              class="task-title-input"
              placeholder="Task title"
              maxlength="200"
              rows="1"
              required
            ></textarea>
            <label class="visually-hidden" for="task-description">Task description</label>
            <textarea
              id="task-description"
              name="description"
              class="task-description-input"
              placeholder="Task description"
              maxlength="500"
              rows="2"
            ></textarea>
            <div id="new-subtask-editor"></div>
            <div class="schedule-inputs">
              <fieldset class="schedule-fieldset">
                <legend class="visually-hidden">Task date and time</legend>
                <div class="schedule-picker">
                  <button id="task-field" class="schedule-field" type="button">
                    <svg class="schedule-clock-icon" viewBox="0 0 24 24" aria-hidden="true">
                      <circle cx="12" cy="12" r="8.5" />
                      <path d="M12 7v5l3 2" />
                    </svg>
                    <span id="task-date-text">Today</span>
                  </button>
                  <input id="task-date" type="hidden" />
                  <input id="task-end-date" type="hidden" />
                </div>
              </fieldset>
              <div class="task-form-actions">
                <button id="cancel-task-form" class="cancel-task-button" type="button">Cancel</button>
                <button class="add-task-submit" type="submit">Add</button>
              </div>
            </div>
          </form>
          <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
        </section>

        <section id="empty-state" class="empty-state" aria-live="polite" hidden>
          <img id="empty-state-image" class="empty-state-image" src="assets/calendar.jpg" alt="" />
          <h3 id="empty-state-title">No tasks yet</h3>
          <p id="empty-state-description">Add a task to get started.</p>
        </section>
        <ul id="task-list" class="task-list" aria-label="Tasks"></ul>
        </section>
      </div>
    </main>

    <button id="open-task-form" class="floating-add-button" type="button" aria-controls="new-task-panel" aria-expanded="false">
      <span aria-hidden="true">+</span> Add task
    </button>

    <div id="delete-toast" class="delete-toast" role="status" aria-live="polite" aria-hidden="true" hidden>
      <span>Task deleted</span>
      <button id="undo-delete" class="undo-delete-button" type="button">Undo</button>
      <button id="close-delete-toast" class="close-delete-toast" type="button" aria-label="Close delete message">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" />
        </svg>
      </button>
    </div>

    <template id="task-template">
      <li class="task-item">
        <div class="task-content">
          <div class="task-schedule-row">
            <div class="task-schedule-meta">
              <button class="task-schedule" type="button"></button>
              <span class="task-repeat-icon" role="img" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M17 2l4 4-4 4" />
                  <path d="M3 11V9a3 3 0 0 1 3-3h15" />
                  <path d="M7 22l-4-4 4-4" />
                  <path d="M21 13v2a3 3 0 0 1-3 3H3" />
                </svg>
              </span>
            </div>
            <div class="task-actions">
              <div class="task-overflow">
                <button class="task-overflow-button" type="button" aria-label="Open task actions" aria-expanded="false" aria-haspopup="menu">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="5" cy="12" r="1.75" />
                    <circle cx="12" cy="12" r="1.75" />
                    <circle cx="19" cy="12" r="1.75" />
                  </svg>
                </button>
                <div class="task-action-menu" role="menu" hidden>
                  <button class="edit-button" type="button" role="menuitem">Edit</button>
                  <button class="archive-button" type="button" role="menuitem" hidden>Archive</button>
                  <button class="delete-button" type="button" role="menuitem">Delete</button>
                </div>
              </div>
            </div>
          </div>
          <div class="task-main">
            <input class="task-toggle" type="checkbox" />
            <div class="task-details">
              <p class="task-title"></p>
              <p class="task-description"></p>
              <div class="task-subtasks" hidden>
                <p class="subtask-progress"></p>
                <ul class="subtask-list"></ul>
              </div>
            </div>
          </div>
        </div>
      </li>
    </template>

    <dialog id="schedule-dialog" class="schedule-dialog" aria-labelledby="schedule-dialog-title">
      <form id="schedule-dialog-form" class="schedule-dialog-form">
        <div class="dialog-heading">
          <h2 id="schedule-dialog-title">Choose date and time</h2>
          <button id="schedule-cancel" class="dialog-close" type="button" aria-label="Close date and time picker">×</button>
        </div>
        <section class="calendar-picker" aria-label="Choose a date">
          <div class="calendar-header">
            <button id="calendar-previous" class="calendar-navigation" type="button" aria-label="Previous month">‹</button>
            <p id="calendar-month" class="calendar-month" aria-live="polite"></p>
            <button id="calendar-next" class="calendar-navigation" type="button" aria-label="Next month">›</button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
          </div>
          <div id="calendar-days" class="calendar-days" role="grid" aria-label="Calendar dates"></div>
        </section>
        <div class="calendar-selection-row">
          <p id="selected-calendar-date" class="selected-calendar-date"></p>
          <div class="dialog-time-controls">
            <label class="visually-hidden" for="dialog-start-time">Start time</label>
            <select id="dialog-start-time" class="dialog-time" aria-label="Choose a start time"></select>
            <label class="visually-hidden" for="dialog-end-time">End time</label>
            <select id="dialog-end-time" class="dialog-time" aria-label="Choose an end time"></select>
          </div>
        </div>
        <label class="dialog-repeat-control" for="dialog-repeat">
          <span>Repeat</span>
          <select id="dialog-repeat" class="dialog-time">
            <option value="none">Does not repeat</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
        <fieldset id="weekly-repeat-days" class="weekly-repeat-days" hidden>
          <legend>Repeat on</legend>
          <div class="weekday-options">
            <label><input type="checkbox" value="1" />Mon</label>
            <label><input type="checkbox" value="2" />Tue</label>
            <label><input type="checkbox" value="3" />Wed</label>
            <label><input type="checkbox" value="4" />Thu</label>
            <label><input type="checkbox" value="5" />Fri</label>
            <label><input type="checkbox" value="6" />Sat</label>
            <label><input type="checkbox" value="0" />Sun</label>
          </div>
        </fieldset>
        <p id="dialog-message" class="dialog-message" role="alert"></p>
        <div class="dialog-actions">
          <button id="schedule-cancel-secondary" type="button">Cancel</button>
          <button type="submit">Apply</button>
        </div>
      </form>
    </dialog>

    <dialog id="upcoming-calendar-dialog" class="schedule-dialog upcoming-calendar-dialog" aria-labelledby="upcoming-calendar-title">
      <div class="upcoming-calendar-content">
        <div class="dialog-heading">
          <h2 id="upcoming-calendar-title">Choose a date</h2>
          <button id="upcoming-calendar-close" class="dialog-close" type="button" aria-label="Close calendar">×</button>
        </div>
        <section class="calendar-picker" aria-label="Choose a task date">
          <div class="calendar-header">
            <button id="upcoming-calendar-previous" class="calendar-navigation" type="button" aria-label="Previous month">‹</button>
            <p id="upcoming-calendar-month" class="calendar-month" aria-live="polite"></p>
            <button id="upcoming-calendar-next" class="calendar-navigation" type="button" aria-label="Next month">›</button>
          </div>
          <div class="calendar-weekdays" aria-hidden="true">
            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
          </div>
          <div id="upcoming-calendar-days" class="calendar-days" role="grid" aria-label="Task dates"></div>
        </section>
        <p id="upcoming-calendar-message" class="upcoming-calendar-message" role="status" aria-live="polite"></p>
      </div>
    </dialog>

    <script src="script.js?v=mobile-more-sheet"></script>
  </body>
</html>
